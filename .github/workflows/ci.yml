name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MMA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mma
      MMA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mma
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests airflow scripts
          ruff format --check src tests airflow scripts
      - name: Unit, pipeline and serving tests
        run: pytest -q
      - name: Quick study, held-out rerun, serving benchmark, report and gate
        run: mma all --profile quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-report
          path: |
            runs/quick/results.json
            runs/quick/REPORT.md

  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the ML package
        run: pip install -e ".[dev]"
      - name: Install Airflow in its own environment
        run: |
          python -m venv /tmp/af
          /tmp/af/bin/pip install -q "apache-airflow==3.1.0" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.1.0/constraints-3.12.txt"
      - name: Run the DAG end to end
        run: |
          export MMA_PYTHON="$(command -v python)"   # the ML interpreter, before Airflow's venv goes on PATH
          export PATH=/tmp/af/bin:$PATH
          scripts/airflow_dag_test.sh /tmp/dagtest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx biome ci src e2e
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
