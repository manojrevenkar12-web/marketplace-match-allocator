[project]
name = "marketplace-match-allocator"
version = "0.1.0"
description = "Capacity-aware homeowner-partner matching with experiments that hold up in a two-sided marketplace."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "duckdb>=1.1", "lightgbm>=4.3", "scikit-learn>=1.4",
  "mlflow>=2.14", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "pyyaml>=6", "psycopg[binary]>=3.1", "psycopg-pool>=3.2", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "dbt-duckdb>=1.8"]

[project.scripts]
mma = "mma.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds data and models", "db: needs Postgres (MMA_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
