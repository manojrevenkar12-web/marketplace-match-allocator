# THE TRUTH. Only src/mma/sim and src/mma/evaluate read this file. A homeowner marketplace modelled on
# what Aroundhome publishes: requests across Germany's postcode regions in 7 product categories, at most
# 3 partners per request, partners pay a fixed price per lead and cap their monthly volume, about one
# request in ten becomes an order.
grid: { cols: 10, rows: 9 }            # 90 two-digit postcode regions, "10".."99"
region_demand_sigma: 0.6               # log-normal spread of demand across regions
supply_elasticity: 0.7                 # partner density ~ demand^0.7: cities oversupplied, rural undersupplied
requests_per_month: 24000
partners: 1100
days_per_month: 30
history_months: 4                      # months logged under the current (rules) logic before modelling
categories:
  solar:            { share: 0.30, price: 55,  intent: 0.16, margin: 2500 }
  heat_pump:        { share: 0.20, price: 65,  intent: 0.14, margin: 3000 }
  windows:          { share: 0.15, price: 35,  intent: 0.18, margin: 900 }
  roofing:          { share: 0.10, price: 45,  intent: 0.15, margin: 1500 }
  kitchen:          { share: 0.08, price: 30,  intent: 0.20, margin: 1200 }
  stairlift:        { share: 0.09, price: 50,  intent: 0.22, margin: 1400 }
  real_estate_sale: { share: 0.08, price: 300, intent: 0.10, margin: 9000 }
request:
  budget: { low: 0.35, mid: 0.45, high: 0.20 }
  budget_intent: { low: 0.7, mid: 1.0, high: 1.35 }
  timeframe: { asap: 0.30, months_3: 0.45, later: 0.25 }
  timeframe_intent: { asap: 1.4, months_3: 1.0, later: 0.55 }
  qualified_share: 0.55                # phone-qualified before matching
  qualified_intent: 1.3
  intent_noise: 0.35                   # hidden homeowner heterogeneity (log scale)
  daily_shape: [0.9, 1.15, 1.1, 1.05, 1.0, 0.85, 0.95]   # Monday..Sunday
partner:
  categories: [1, 2]
  radius: { 0: 0.35, 1: 0.45, 2: 0.20 }  # grid steps served around the home region
  cap_median: 42
  cap_sigma: 0.55
  cap_min: 3
  contact_logit: { mean: 1.0, sd: 0.8 }
  speed_hours: { median: 6, sigma: 0.75 }
  skill: { mean: 0.0, sd: 0.6 }
  pause_share: 0.06                    # partners pausing for part of a month
outcome:
  qualified_contact: 0.4
  asap_contact: 0.3
  overload_contact: -1.5               # contact rate falls when a partner is past 80% of its cap
  satisfy_bias: 0.5
  distance_penalty: 0.35
  first_contact_bonus: 0.8             # "Schnell sein lohnt sich": the first caller is preferred
  second_contact_bonus: 0.3
  win_delay_days: [7, 40]
